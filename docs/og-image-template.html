<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Inter Variable';
				src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
					format('woff2-variations');
				font-weight: 100 900;
			}
			@font-face {
				font-family: 'Fira Code Variable';
				src: url('../node_modules/@fontsource-variable/fira-code/files/fira-code-latin-wght-normal.woff2')
					format('woff2-variations');
				font-weight: 300 700;
			}
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				width: 1200px;
				height: 630px;
				background: oklch(0.155 0.005 285.8);
				font-family: 'Inter Variable', sans-serif;
				position: relative;
				overflow: hidden;
			}
			.glow {
				position: absolute;
				inset: 0;
				background: radial-gradient(
					ellipse 65% 55% at 50% -10%,
					oklch(0.79 0.135 165 / 13%),
					transparent 70%
				);
			}
			.grid {
				position: absolute;
				inset: 0;
				background-image: radial-gradient(oklch(1 0 0 / 7%) 1.5px, transparent 1.5px);
				background-size: 30px 30px;
				mask-image: linear-gradient(to bottom, black, transparent 85%);
				-webkit-mask-image: linear-gradient(to bottom, black, transparent 85%);
			}
			.content {
				position: absolute;
				left: 90px;
				top: 50%;
				transform: translateY(-54%);
			}
			.prompt {
				font-family: 'Fira Code Variable', monospace;
				font-size: 26px;
				color: oklch(0.66 0.012 286);
			}
			.prompt .accent {
				color: oklch(0.79 0.135 165);
			}
			.name {
				margin-top: 30px;
				font-size: 104px;
				font-weight: 750;
				letter-spacing: -0.03em;
				color: oklch(0.95 0.004 286.3);
			}
			.role {
				margin-top: 20px;
				font-family: 'Fira Code Variable', monospace;
				font-size: 36px;
				color: oklch(0.79 0.135 165);
			}
			.footer {
				position: absolute;
				left: 90px;
				right: 90px;
				bottom: 62px;
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				font-family: 'Fira Code Variable', monospace;
				font-size: 24px;
				color: oklch(0.66 0.012 286);
			}
			.footer .site .dim {
				color: oklch(0.66 0.012 286);
			}
			.footer .site {
				color: oklch(0.92 0.004 286.3);
			}
			.footer .site .accent {
				color: oklch(0.79 0.135 165);
			}
			.rule {
				position: absolute;
				left: 90px;
				right: 90px;
				bottom: 130px;
				height: 1px;
				background: oklch(1 0 0 / 10%);
			}
		</style>
	</head>
	<body>
		<div class="glow"></div>
		<div class="grid"></div>
		<div class="content">
			<p class="prompt"><span class="accent">~ $</span> whoami</p>
			<h1 class="name">Jakub Zehner</h1>
			<p class="role">fullstack .NET/React developer</p>
		</div>
		<div class="rule"></div>
		<div class="footer">
			<span class="site"><span class="dim">~/</span>jzehner<span class="accent">.dev</span></span>
			<span>Poland</span>
		</div>
	</body>
</html>
